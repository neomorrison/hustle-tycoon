<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>3D Lab</title>
<style>
  :root { --bg: #fbf3e7; --panel: #fffaf2; --ink: #3b3530; --sub: #8a8078; --line: #eadfce; --accent: #e88c73; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font: 13px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif; color: var(--ink); background: var(--bg); }
  body { display: flex; }
  #view { position: relative; flex: 1; min-width: 0; background: radial-gradient(ellipse at 50% 40%, #fffdf8 0%, var(--bg) 70%); }
  #view.dark { background: radial-gradient(ellipse at 50% 40%, #1a2a5a 0%, #08143a 70%); }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #panel { width: 300px; flex: none; overflow: auto; background: var(--panel); border-left: 1px solid var(--line); padding: 12px 14px 40px; }
  body.snap #panel { display: none; }
  h1 { font-size: 15px; margin: 0 0 8px; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--sub); margin: 14px 0 6px; }
  label { display: flex; align-items: center; gap: 6px; margin: 4px 0; }
  label > span { width: 84px; color: var(--sub); flex: none; }
  select, input[type=number], input[type=text] { flex: 1; min-width: 0; padding: 3px 5px; border: 1px solid var(--line); border-radius: 6px; background: #fff; font: inherit; }
  input[type=range] { flex: 1; }
  .row { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0; }
  button { padding: 4px 8px; border: 1px solid var(--line); border-radius: 7px; background: #fff; cursor: pointer; font: inherit; }
  button:hover { border-color: var(--accent); }
  pre { font: 11px/1.35 ui-monospace, Consolas, monospace; background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 6px; white-space: pre-wrap; margin: 4px 0; max-height: 260px; overflow: auto; }
  #err { position: absolute; left: 12px; top: 12px; right: 12px; color: #a33; font-weight: 600; white-space: pre-wrap; pointer-events: none; }
  #tag { position: absolute; pointer-events: none; transform: translate(-50%, -100%); background: #fff; border-radius: 10px; padding: 2px 8px; font-size: 12px; box-shadow: 0 2px 8px #0002; white-space: nowrap; display: none; }
  .bubble { position: absolute; pointer-events: none; transform: translate(-50%, -100%); background: #fff; border-radius: 12px; padding: 1px 7px; font-size: 11px; box-shadow: 0 1px 5px #0002; white-space: nowrap; }
  body.snap .bubble, body.snap #tag { display: none !important; }
</style>
</head>
<body>
  <div id="view"><canvas id="c"></canvas><div id="tag"></div><div id="err"></div></div>
  <div id="panel">
    <h1>3D Lab</h1>
    <label><span>Room</span><select id="room"></select></label>
    <label><span>Quality</span><select id="quality"><option>high</option><option>low</option></select></label>
    <h2>People</h2>
    <label><span>Actors</span><input id="actors" type="number" min="0" max="12" value="1" /></label>
    <label><span>Task (all)</span><select id="task"></select></label>
    <div class="row"><button id="routine">Routine: door→bed→desk→fridge</button><button id="scatter">Each to a seat</button></div>
    <label><span>Mood</span><select id="mood"><option>neutral</option><option>happy</option><option>tired</option><option>stressed</option></select></label>
    <div class="row"><button data-emote="cheer">cheer</button><button data-emote="wave">wave</button><button data-emote="talk">talk</button><button data-emote="stressed">stressed</button><button id="hold">hold phone</button></div>
    <h2>World</h2>
    <label><span>Time</span><input id="tod" type="range" min="0" max="24" step="0.1" value="12" /><b id="todv">12.0</b></label>
    <label><span>Speed</span><select id="speed"><option value="0">0 (paused)</option><option value="0.5">0.5</option><option value="1" selected>1</option><option value="2">2</option><option value="4">4</option></select></label>
    <label><span>Staff desks</span><input id="desks" type="number" min="0" max="7" value="7" /></label>
    <label><span>Boxes</span><input id="boxes" type="range" min="0" max="2000" step="1" value="0" /><b id="boxv">0</b></label>
    <div class="row" id="gear"></div>
    <h2>Camera</h2>
    <div class="row"><button id="rl">⟲ 90</button><button id="rr">⟳ 90</button><button id="zi">zoom +</button><button id="zo">zoom −</button><button id="reset">reset</button><button id="orbit">orbit</button></div>
    <h2>Stats</h2>
    <pre id="stats"></pre>
    <h2>Events</h2>
    <pre id="log"></pre>
  </div>
  <script type="module" src="./lab.ts"></script>
</body>
</html>
